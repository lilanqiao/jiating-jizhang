<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7a5f">
<title>家庭记账台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭记账台">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1c2321; --sub:#6b7a75;
  --green:#0e7a5f; --green-d:#0a5f4a; --red:#c0392b; --line:#e6ebe9;
  --shadow:0 2px 10px rgba(0,0,0,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.htitle{font-size:17px;font-weight:600;letter-spacing:.5px}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px;font-size:14px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.who .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.summary{display:flex;gap:12px;margin-top:14px}
.scard{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.scard .k{font-size:12px;opacity:.85}
.scard .v{font-size:20px;font-weight:700;margin-top:2px}

/* ---------- list ---------- */
main{padding:14px 14px 120px}
.daygroup{margin-bottom:16px}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:2px 6px 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.item .emoji{width:40px;height:40px;border-radius:11px;background:#eef4f1;display:grid;place-items:center;font-size:20px;flex:none}
.item .mid{flex:1;min-width:0}
.item .note{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:#eef4f1;color:var(--green-d);border-radius:999px;padding:1px 8px;font-size:11px}
.pill.person{background:#eaf1fb;color:#2c5aa0}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--green)}
.amt.out{color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.empty .big{font-size:44px;margin-bottom:10px}

/* ---------- FAB ---------- */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + var(--safe-b));z-index:30;
  width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));
  color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(14,122,95,.45);display:grid;place-items:center}
.fab:active{transform:translateX(-50%) scale(.94)}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + var(--safe-b));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:2px 0 14px;font-size:17px;text-align:center}
/* 统计弹窗：固定头(带✕)+可滚动身体,长内容也能随手关 */
#sheet5{padding:0;overflow:hidden;display:flex;flex-direction:column}
#sheet5 .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:none}
#sheet5 .sheet-head b{font-size:17px}
#sheet5 .sheet-x{width:34px;height:34px;border-radius:50%;background:#eef1f0;color:var(--ink);font-size:15px;display:grid;place-items:center;flex:none}
#sheet5 .sheet-body{overflow:auto;padding:14px 18px calc(18px + var(--safe-b))}
.seg{display:flex;background:#eef1f0;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--sub)}
.seg button.act{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.seg button.act.out{color:var(--red)}
.seg button.act.in{color:var(--green)}

.voicebtn{width:100%;background:#eef4f1;border:1.5px dashed var(--green);color:var(--green-d);border-radius:14px;
  padding:16px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.voicebtn.rec{background:#fdecea;border-color:var(--red);color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.amtin{font-size:26px;font-weight:700;text-align:center}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;align-items:center;gap:5px;background:#fff}
.cat.act{border-color:var(--green);background:#eef4f1;color:var(--green-d);font-weight:600}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 12px;min-height:16px}
.hint b{color:var(--green-d)}
.save{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:16px;font-weight:700;margin-top:4px}
.save:disabled{opacity:.5}

/* ---------- who picker ---------- */
.people{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px}
.person-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.person-row .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.linkbtn{background:none;color:var(--sub);font-size:13px;text-decoration:underline;padding:6px}

/* ---------- detail ---------- */
.dAmt{font-size:34px;font-weight:800;text-align:center;margin:2px 0 16px;font-variant-numeric:tabular-nums}
.dAmt.in{color:var(--green)} .dAmt.out{color:var(--ink)}
.dRow{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
.dRow span{color:var(--sub)}
.dRow b{font-weight:600}
.dRaw{margin:16px 0 8px}
.dRawLabel{font-size:12px;color:var(--sub);margin-bottom:6px}
.dRawText{background:#f1f4f3;border-radius:12px;padding:12px 14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.delbtn{width:100%;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--red);color:var(--red);font-size:15px;font-weight:700;margin-top:16px}

/* ---------- toggle / recurring ---------- */
.toggle{display:flex;align-items:center;gap:10px;padding:10px 2px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--green)}
.pill.nocount{background:#eee;color:#888}
.amt.nocount{color:#b0b0b0;font-weight:600}
.recur-item{display:flex;align-items:center;justify-content:space-between;background:#f4f6f5;border-radius:12px;padding:11px 13px;margin-bottom:8px}
.recur-item .ri-body{flex:1;cursor:pointer}
.recur-item .ri-main{font-weight:600}
.recur-item .ri-sub{font-size:12px;color:var(--sub);margin-top:2px}
.recur-item .ri-del{color:var(--red);font-size:13px;padding:6px 8px;flex:none}
.rform .seg.small button{padding:8px;font-size:14px}
.rform select,.rform input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.rrow{display:flex;gap:10px}.rrow>*{flex:1}
.recur-empty{color:var(--sub);font-size:13px;text-align:center;padding:10px 0 4px}

/* ---------- stats ---------- */
.stat-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.stat-nav button{width:40px;height:40px;border-radius:10px;background:#eef1f0;font-size:20px;color:var(--ink)}
.stat-nav #statTitle{font-size:16px;font-weight:700;min-width:120px;text-align:center}
.stat-cards{display:flex;gap:10px}
.stat-cards>div{flex:1;background:#f4f6f5;border-radius:12px;padding:10px 12px}
.stat-cards .k{font-size:12px;color:var(--sub)}
.stat-cards .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-sec{font-size:13px;color:var(--sub);font-weight:600;margin:18px 0 10px}
.catbar{margin-bottom:11px}
.catbar .cb-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.catbar .cb-track{height:8px;background:#eef1f0;border-radius:99px;overflow:hidden}
.catbar .cb-fill{height:100%;background:linear-gradient(90deg,#1a9e7c,var(--green-d));border-radius:99px}
.pstat{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f4f6f5;border-radius:12px;margin-bottom:8px}
.pstat .pn{display:flex;align-items:center;gap:8px;font-weight:600}
.pstat .pn .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.pstat .pv{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.stat-empty{color:var(--sub);font-size:13px;text-align:center;padding:16px 0}
.pstat{cursor:pointer}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);z-index:80;background:rgba(28,35,33,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;max-width:80%;text-align:center;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 固定支出小条 */
.fixedbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.fixedbar .fb-t{font-weight:700;font-size:15px}
.fixedbar .fb-s{font-size:12px;color:var(--sub);margin-top:2px}
.fixedbar .fb-r{font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 叠层：详情盖在明细页之上，记一笔/编辑盖在最上 */
#mask3{z-index:61}#sheet3{z-index:62}
#mask{z-index:63}#sheet{z-index:64}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htitle">🏠 家庭记账台</div>
    <div style="display:flex;gap:7px;align-items:center">
      <button class="who" id="statBtn">📊</button>
      <button class="who" id="recurBtn">⏱</button>
      <button class="who" id="whoBtn"><span class="dot" id="whoDot">?</span><span id="whoName">选择</span></button>
    </div>
  </div>
  <div class="summary" id="summary">
    <div class="scard"><div class="k">本月支出</div><div class="v" id="mOut">¥0</div></div>
    <div class="scard"><div class="k">本月收入</div><div class="v" id="mIn">¥0</div></div>
    <div class="scard"><div class="k">结余</div><div class="v" id="mNet">¥0</div></div>
  </div>
</header>

<main id="list"></main>

<button class="fab" id="fab">＋</button>

<!-- add sheet -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3>记一笔</h3>
  <div class="seg">
    <button id="segOut" class="act out">支出</button>
    <button id="segIn">收入</button>
  </div>

  <button class="voicebtn" id="voiceBtn">🎤 长按说话，自动填好（也可直接打字）</button>
  <div class="hint" id="hint">例：中午吃饭花了 38 &nbsp;·&nbsp; 发工资 8000</div>

  <div class="field">
    <label>金额</label>
    <input class="amtin" id="amt" type="number" inputmode="decimal" placeholder="0.00">
  </div>
  <div class="field">
    <label>分类</label>
    <div class="cats" id="cats"></div>
  </div>
  <div class="field">
    <label>备注</label>
    <input id="note" type="text" placeholder="说一句话，例：中午吃饭花了38">
  </div>
  <label class="toggle"><input type="checkbox" id="noCount"><span>还款 / 转账（不计入收支统计）</span></label>
  <button class="save" id="save" disabled>保存</button>
</div>

<!-- who sheet -->
<div class="mask" id="mask2"></div>
<div class="sheet" id="sheet2">
  <h3>这台手机是谁在用？</h3>
  <div class="people" id="people"></div>
  <div class="hint">选好后这台手机记的账都会自动记在这个人名下。<br>换人？随时点右上角头像切换。</div>
</div>

<!-- detail sheet -->
<div class="mask" id="mask3"></div>
<div class="sheet" id="sheet3">
  <h3>这一笔</h3>
  <div id="detailBody"></div>
  <button class="save" id="detailEdit" style="margin-top:16px">✏️ 编辑这一笔</button>
  <button class="delbtn" id="detailDel" style="margin-top:10px">🗑 删除这一笔</button>
</div>

<!-- stats sheet -->
<div class="mask" id="mask5"></div>
<div class="sheet" id="sheet5">
  <div class="sheet-head"><b>📊 统计</b><button class="sheet-x" id="statClose" aria-label="关闭">✕</button></div>
  <div class="sheet-body">
    <div class="stat-nav"><button id="statPrev">‹</button><div id="statTitle">—</div><button id="statNext">›</button></div>
    <div class="seg small" style="margin-bottom:14px"><button id="statMonthBtn" class="act">按月</button><button id="statYearBtn">按年</button></div>
    <div class="stat-cards">
      <div><div class="k">支出</div><div class="v" id="stOut">¥0</div></div>
      <div><div class="k">收入</div><div class="v" id="stIn">¥0</div></div>
      <div><div class="k">结余</div><div class="v" id="stNet">¥0</div></div>
    </div>
    <div class="stat-sec">支出去向（钱花在哪）</div>
    <div id="statCats"></div>
    <div class="stat-sec">按成员（谁花的/谁挣的）</div>
    <div id="statPeople"></div>
  </div>
</div>

<!-- detail-list sheet (固定支出/某人明细) -->
<div class="mask" id="mask6"></div>
<div class="sheet" id="sheet6">
  <h3 id="listSheetTitle">明细</h3>
  <div id="listSheetBody"></div>
</div>

<!-- recurring sheet -->
<div class="mask" id="mask4"></div>
<div class="sheet" id="sheet4">
  <h3>⏱ 周期记账</h3>
  <div class="hint" style="text-align:left;margin:0 0 10px">保险、话费、房租、宽带、会员这种固定自动扣费，设一次，App 到点自动帮你记上，绝不漏。</div>
  <div id="recurList"></div>
  <button class="save" id="recurAddBtn" style="background:#fff;border:1px solid var(--green);color:var(--green-d)">＋ 添加一个定期项目</button>
  <div id="recurForm" class="rform" hidden>
    <div class="seg" style="margin-top:14px"><button id="rSegOut" class="act out">支出</button><button id="rSegIn">收入</button></div>
    <div class="field"><label>名称（如：话费、保险、房租）</label><input id="rName" type="text" placeholder="话费"></div>
    <div class="rrow">
      <div class="field"><label>金额</label><input id="rAmt" type="number" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label>分类</label><select id="rCat"></select></div>
    </div>
    <div class="seg small"><button id="rMonthly" class="act">每月</button><button id="rYearly">每年</button></div>
    <div class="rrow">
      <div class="field" id="rMonthWrap" hidden><label>几月</label><select id="rMonth"></select></div>
      <div class="field"><label>几号</label><select id="rDay"></select></div>
    </div>
    <button class="save" id="rSave">保存这个定期项目</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=27"></script>
<script src="sync.js?v=27"></script>
<script src="app.js?v=27"></script>
</body>
</html>
